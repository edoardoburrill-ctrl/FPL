name: Sync FPL data

# Price changes land overnight (around 01:30 UK time) and are never reported
# retrospectively, so catching them means having a snapshot from before and
# after. Twice a day is enough to see every change and to keep transfer momentum
# current without burning the odds API's free tier.
on:
  schedule:
    - cron: "45 1 * * *"
    - cron: "45 12 * * *"
  workflow_dispatch:

concurrency:
  group: fpl-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e .

      # The snapshot database is the only state that has to survive between
      # runs; without it every run would think it was the first and no price
      # change would ever be detected.
      - name: Restore data
        uses: actions/cache/restore@v4
        with:
          path: data
          key: fpl-data-${{ github.run_id }}
          restore-keys: fpl-data-

      - name: Sync
        env:
          FPL_ENTRY_ID: ${{ vars.FPL_ENTRY_ID }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: fpl sync --deep

      - name: Save data
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data
          key: fpl-data-${{ github.run_id }}
