[project]
name = "fpl-advisor"
version = "0.1.0"
description = "Quantitative decision engine for Fantasy Premier League"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "pulp>=2.8",
    "typer>=0.12",
    "rich>=13.7",
    "platformdirs>=4.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
fpl = "fpl.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fpl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # PuLP 3.x warns about its own PuLP 4 migration on every variable created.
    "ignore::DeprecationWarning:pulp",
]
